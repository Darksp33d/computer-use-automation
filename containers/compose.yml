services:
  target:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      target: target
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.5
    networks: [execution]
  browser:
    build:
      context: ..
      dockerfile: containers/Dockerfile
      target: browser
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    shm_size: 256m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    networks: [execution]
  receiver:
    profiles: [verification]
    build:
      context: ..
      dockerfile: containers/Dockerfile
      target: receiver
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    networks: [outside]
networks:
  outside: {}
  execution:
    internal: true
